# Настройки лидогенератора. Меняйте смело: это обычный текст.
# После "#" идут комментарии, программа их не читает.

# ---------- О вас: подставляется в сообщения ----------
sender:
  name: "Елизавета Удахина"    # ваше имя для подписи в сообщениях
  company: ""                  # название студии, если есть
  portfolio_url: "https://lizdiz.tilda.ws/"   # портфолио сайтов
  telegram: ""                 # ваш @username для ответа

# ---------- Что продаём ----------
offers:
  site:
    title: "Сайт-посадочная под SEO и Яндекс Директ"
    price_from: 80000
    pitch: >-
      Делаем не «визитку», а рабочий инструмент продаж: посадочная страница
      под поисковые запросы вашего города, выход в выдачу Яндекса и настройка
      Яндекс Директа, чтобы заявки шли каждый день.
    # proof — фраза-доказательство, добавляется к сообщению. Пусто = не добавлять.
    proof: "Примеры моих сайтов: https://lizdiz.tilda.ws/"
  ai:
    title: "ИИ-помощник по сервису и возвращаемости клиентов"
    price_from: 20000
    pitch: >-
      Ставим ИИ-ассистента, который отвечает клиентам 24/7, записывает,
      напоминает о визите, собирает отзывы и возвращает тех, кто давно не
      приходил. Это деньги с клиентов, за которых вы уже заплатили рекламой.
    # Пока нет своих кейсов, говорим цифрами как ОЦЕНКОЙ, а не как «мы сделали клиенту».
    # Когда появятся настоящие результаты — замените на них.
    proof: >-
      Для понимания масштаба: ответы клиентам, таблицы, документы и контент
      для соцсетей обычно съедают 10–20 часов в неделю и от 20 000 ₽ в месяц
      на подрядчиков. ИИ забирает большую часть этой работы.
  leadgen:
    title: "Лидогенерация для отдела продаж"
    price_from: 20000
    pitch: >-
      Автоматически находим и квалифицируем компании из вашей целевой
      аудитории, собираем контакты ЛПР и готовим персональные первые касания,
      чтобы менеджеры звонили тёплым, а не случайным.
    proof: ""

# ---------- Города ----------
cities:
  - Санкт-Петербург
  - Москва
  - Екатеринбург
  - Краснодар
  - Казань

# ---------- Ниши ----------
# queries: что искать на картах
# ltv: насколько выручка зависит от повторных визитов (1-5), влияет на оценку ИИ
# main_offer: что предлагать в первую очередь (site / ai / leadgen)
# pain: боль, на которую давим в сообщении
# okved: коды вида деятельности из ЕГРЮЛ — по ним отличаем «ООО Династия» клинику от одноимённого агентства недвижимости
niches:
  beauty_clinic:
    name: "Клиники косметологии и эстетической медицины"
    queries: ["косметология", "клиника эстетической медицины"]
    okved: ["86", "96.02", "96.04"]
    ltv: 5
    main_offer: ai
    pain: "клиент сделал одну процедуру и не вернулся на курс"
  dental:
    name: "Стоматологии"
    queries: ["стоматология"]
    okved: ["86.23", "86.2"]
    ltv: 5
    main_offer: ai
    pain: "пациенты не приходят на плановые осмотры и гигиену, пропускают записи"
  medical:
    name: "Медицинские центры"
    queries: ["медицинский центр", "частная клиника"]
    okved: ["86"]
    ltv: 4
    main_offer: ai
    pain: "администраторы не успевают отвечать, пациенты теряются между визитами"
  beauty_salon:
    name: "Салоны красоты и барбершопы"
    queries: ["салон красоты", "барбершоп"]
    okved: ["96.02", "96.04"]
    ltv: 5
    main_offer: ai
    pain: "клиент ушёл к другому мастеру, и никто этого не заметил"
  auto_service:
    name: "Автосервисы и детейлинг"
    queries: ["автосервис", "детейлинг"]
    okved: ["45"]  # 45.2 ремонт, 45.1 дилеры с сервисом
    ltv: 4
    main_offer: ai
    pain: "клиент приехал один раз и забыл о вас до следующей поломки"
  vet:
    name: "Ветеринарные клиники"
    queries: ["ветеринарная клиника"]
    okved: ["75"]
    ltv: 5
    main_offer: ai
    pain: "владельцы забывают о прививках и плановых осмотрах питомцев"
  fitness:
    name: "Фитнес-клубы и студии"
    queries: ["фитнес клуб", "студия пилатеса", "студия йоги"]
    okved: ["93.1", "85.41", "96.04"]
    ltv: 5
    main_offer: ai
    pain: "абонементы не продлевают, отток после первого месяца"
  kids_edu:
    name: "Детские центры и языковые школы"
    queries: ["детский развивающий центр", "языковая школа"]
    okved: ["85"]
    ltv: 4
    main_offer: ai
    pain: "родители не продлевают абонемент, пробные занятия не доходят до оплаты"
  spa_massage:
    name: "СПА и массажные салоны"
    queries: ["массажный салон", "спа салон"]
    okved: ["96.04", "96.02", "86.90"]
    ltv: 4
    main_offer: ai
    pain: "курс продан один раз, повторных записей мало"
  # --- B2B: предлагаем лидогенерацию для отдела продаж ---
  b2b_wholesale:
    name: "Оптовые поставщики и производства (B2B)"
    queries: ["оптовая компания", "производство"]
    ltv: 3
    main_offer: leadgen
    pain: "менеджеры тратят время на холодные базы вместо сделок"
  b2b_services:
    name: "B2B-услуги: логистика, клининг, IT, бухгалтерия"
    queries: ["логистическая компания", "клининговая компания", "бухгалтерские услуги"]
    ltv: 3
    main_offer: leadgen
    pain: "поток новых клиентов зависит от сарафана и одного менеджера"

# ---------- Ограничения ----------
limits:
  per_query: 50          # сколько компаний брать на один запрос (ниша+город)
  site_timeout_sec: 12   # сколько ждать ответа сайта
  min_rating_for_ai: 0   # 0 = не фильтровать по рейтингу

# ---------- Нейросеть для сообщений ----------
# Если ANTHROPIC_API_KEY пустой, используются готовые шаблоны без нейросети.
llm:
  enabled: true
  model: "claude-opus-5-5"
